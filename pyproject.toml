[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
    "E741",  # ambiguous variable name
    "E402",  # module level import not at top of file (needed for Streamlit sys.path configuration)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
